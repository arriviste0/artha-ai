<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Subtle background glow -->
  <circle cx="256" cy="256" r="170" fill="#10b981" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Rupee Symbol (₹) -->
  <g fill="url(#rupeeGrad)">
    <!-- Top Horizontal Bar -->
    <rect x="140" y="130" width="220" height="42" rx="10"/>
    <!-- Middle Horizontal Bar -->
    <rect x="140" y="205" width="200" height="42" rx="10"/>
    <!-- Main Stem & Loop -->
    <path d="M 170,130 H 260 A 65,65 0 0,1 260,260 H 210 V 205 H 250 A 25,25 0 0,0 250,150 H 170 Z"/>
    <rect x="170" y="130" width="42" height="240" rx="8"/>
    <!-- Diagonal Leg -->
    <path d="M 210,245 L 320,380 H 260 L 170,265 Z" />
  </g>

  <!-- AI Spark / Diamond Stars -->
  <path d="M 370,120 Q 370,165 415,165 Q 370,165 370,210 Q 370,165 325,165 Q 370,165 370,120 Z" fill="url(#sparkGrad)" filter="url(#glow)"/>
  <path d="M 130,350 Q 130,370 150,370 Q 130,370 130,390 Q 130,370 110,370 Q 130,370 130,350 Z" fill="#34d399" opacity="0.8"/>
</svg>
